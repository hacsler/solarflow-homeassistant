# ==============================================================================
# Zendure settings - dedicated dashboard
# Setup: Settings -> Dashboards -> Add dashboard -> "New dashboard from scratch"
# -> open -> pencil (top right) -> three dots -> Raw configuration editor -> replace everything
# with the content of this file.
#
# All rows with a slider, input field, switch or selection can be operated directly (helpers).
# Rows without a control (status) only show the value so nothing is switched by accident.
# Note: values with "initial:" in the YAML files reset to their default when Home Assistant
# restarts. Change them permanently in the file.
# ==============================================================================
title: Zendure
views:
  - title: Settings
    path: einstellungen
    icon: mdi:battery-charging-wireless
    cards:
      - type: markdown
        content: >-
          **Zendure settings.** Change values directly. Changes to values with a default in the
          file (`initial`) apply until the next restart of Home Assistant.

      # ---- General ----------------------------------------------------------------
      - type: entities
        title: General
        show_header_toggle: false
        entities:
          - entity: sensor.zendure_active_season
            name: Active season
          - entity: input_datetime.zendure_conf_winter_start
            name: Winter start
          - entity: input_datetime.zendure_conf_summer_start
            name: Summer start
          - entity: input_boolean.zendure_auto_mode
            name: Auto mode device 1
          - entity: input_boolean.zendure_coordinator_enabled
            name: Coordinator active
          - entity: input_boolean.zendure_dry_run
            name: Dry run (test only)
          - entity: input_select.zendure_allocation_strategy
            name: Allocation strategy
          - entity: input_boolean.zendure_enabled
            name: Device 1 enabled
          - entity: input_boolean.zendure_2_enabled
            name: Device 2 enabled
          - entity: input_text.zendure_device_ip
            name: IP device 1
          - entity: input_text.zendure_device_2_ip
            name: IP device 2

      # ---- Control -------------------------------------------------------------------
      - type: entities
        title: Control (both devices)
        show_header_toggle: false
        entities:
          - entity: input_number.zendure_conf_max_output
            name: Max. output per device
          - entity: input_number.zendure_conf_hysteresis
            name: Control hysteresis
          - entity: input_number.zendure_conf_grid_bias_winter
            name: Grid buffer winter
          - entity: input_number.zendure_conf_grid_bias_summer
            name: Grid buffer summer
          - entity: input_number.zendure_conf_failsafe_watt
            name: Failsafe base load (Shelly)
          - entity: input_number.zendure_conf_saturation_watt_winter
            name: Min. output full (winter)
          - entity: input_number.zendure_conf_saturation_watt_summer
            name: Min. output full (summer)

      # ---- Battery limits -------------------------------------------------------------
      - type: entities
        title: Battery limits
        show_header_toggle: false
        entities:
          - entity: input_number.zendure_conf_soc_off_winter
            name: Cutoff winter
          - entity: input_number.zendure_conf_soc_off_summer
            name: Cutoff summer
          - entity: input_number.zendure_conf_soc_bypass_winter
            name: Bypass PV only (winter)
          - entity: input_number.zendure_conf_soc_bypass
            name: Bypass PV only (summer)
          - entity: input_number.zendure_conf_soc_emerg_start
            name: Emergency charge start below
          - entity: input_number.zendure_conf_soc_emerg_stop
            name: Emergency charge stop above
          - entity: input_number.zendure_conf_emergency_watt
            name: AC charge power emergency
          - entity: input_number.zendure_conf_calib_days
            name: Calibration after days

      # ---- Forecast -------------------------------------------------------------------
      - type: entities
        title: Forecast
        show_header_toggle: false
        entities:
          - entity: input_number.zendure_conf_forecast_factor
            name: Forecast factor
          - entity: input_number.zendure_conf_forecast_thresh
            name: Forecast threshold emergency
          - entity: input_text.zmon_fc_suffix_1
            name: Forecast suffix device 1
          - entity: input_text.zmon_fc_suffix_2
            name: Forecast suffix device 2

      # ---- Device 2 ----------------------------------------------------------------------
      - type: entities
        title: Device 2 (charge-first and assist)
        show_header_toggle: false
        entities:
          - entity: input_number.zendure_2_conf_capacity_factor
            name: Capacity factor (D1 = 1)
          - entity: input_number.zendure_2_conf_pv_factor
            name: PV factor (D1 = 1)
          - entity: input_number.zendure_2_conf_discharge_release_soc
            name: Release from (0=off)
          - entity: input_number.zendure_2_conf_discharge_hysteresis
            name: Re-lock hysteresis charge-first
          - entity: input_number.zendure_2_conf_assist_deficit_w
            name: Assist from deficit (0=off)
          - entity: input_number.zendure_2_conf_assist_min_soc
            name: Assist minimum charge level
          - type: simple-entity
            entity: input_boolean.zendure_2_discharge_released
            name: Discharge released
          - type: simple-entity
            entity: binary_sensor.zendure_2_assist_request
            name: Assist active (D2)
          - type: simple-entity
            entity: sensor.zendure_assist_deficit
            name: Deficit other devices

      # ---- Status (display only) -------------------------------------------------------
      - type: entities
        title: Status device 1 and 2
        show_header_toggle: false
        entities:
          - type: simple-entity
            entity: input_boolean.zendure_emergency_charge
            name: Emergency charge D1 active
          - type: simple-entity
            entity: input_boolean.zendure_calibration_mode
            name: Calibration D1 running
          - type: simple-entity
            entity: input_datetime.zendure_last_full_charge
            name: Last full charge D1
          - type: simple-entity
            entity: input_number.zendure_last_sent_limit
            name: Last sent D1
          - type: divider
          - type: simple-entity
            entity: input_boolean.zendure_2_emergency_charge
            name: Emergency charge D2 active
          - type: simple-entity
            entity: input_boolean.zendure_2_calibration_mode
            name: Calibration D2 running
          - type: simple-entity
            entity: input_datetime.zendure_2_last_full_charge
            name: Last full charge D2
          - type: simple-entity
            entity: input_number.zendure_2_last_sent_limit
            name: Last sent D2

      # ---- Calculated values -------------------------------------------------------------
      - type: markdown
        title: Effective values (calculated)
        content: |-
          {% set season = 'summer' if states('sensor.zendure_active_season') == 'summer' else 'winter' -%}
          {% set ff = states('input_number.zendure_conf_forecast_factor') | float(100) / 100 -%}
          {% set capf = states('input_number.zendure_2_conf_capacity_factor') | float(0.5) -%}
          {% set pvf = states('input_number.zendure_2_conf_pv_factor') | float(0.25) -%}
          {% set thr = states('input_number.zendure_conf_forecast_thresh') | float(2.5) -%}
          {% set rel = states('input_number.zendure_2_conf_discharge_release_soc') | float(0) -%}
          | Value | Current |
          |---|---|
          | Active cutoff | {{ states('input_number.zendure_conf_soc_off_' ~ season) | float(20) | round(0) | int }} % |
          | Active bypass limit | {{ states('input_number.zendure_conf_soc_bypass' ~ ('_winter' if season == 'winter' else '')) | float(20) | round(0) | int }} % |
          | Active grid buffer | {{ states('input_number.zendure_conf_grid_bias_' ~ season) | float(0) | round(0) | int }} W |
          | D2 failsafe effective | {{ (states('input_number.zendure_conf_failsafe_watt') | float(130) * capf) | round(0) | int }} W |
          | D2 emergency power effective | {{ (states('input_number.zendure_conf_emergency_watt') | float(500) * capf) | round(0) | int }} W |
          | D2 min. output full effective | {{ (states('input_number.zendure_conf_saturation_watt_' ~ season) | float(250) * pvf) | round(0) | int }} W |
          | D1 forecast trigger (raw) | {{ (thr / ff) | round(2) }} kWh |
          | D2 forecast trigger (raw) | {{ (thr * pvf / ff) | round(2) }} kWh |
          | D2 re-lock below | {{ 'off (release 0)' if rel <= 0 else ((rel - states('input_number.zendure_2_conf_discharge_hysteresis') | float(5)) | round(0) | int ~ ' %') }} |

      # ---- Optional: lamp (only with zendure_lamp.yaml) -----------------------------
      - type: entities
        title: Lamp (optional)
        show_header_toggle: false
        entities:
          - entity: input_boolean.zendure_lamp_enforce
            name: Lamp off after start
          - entity: input_number.zendure_conf_lamp_off_value
            name: Value for lamp OFF
