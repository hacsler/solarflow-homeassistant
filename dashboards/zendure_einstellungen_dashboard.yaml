# ==============================================================================
# Zendure Einstellungen - eigenes Dashboard
# Einrichten: Einstellungen -> Dashboards -> Dashboard hinzufügen -> "Neues Dashboard von Grund auf"
# -> öffnen -> Stift (oben rechts) -> drei Punkte -> Raw-Konfigurationseditor -> alles ersetzen
# mit dem Inhalt dieser Datei.
#
# Alle Zeilen mit Schieber, Eingabefeld, Schalter oder Auswahl sind direkt bedienbar (Helper).
# Zeilen ohne Bedienelement (Status) zeigen nur den Wert, damit nichts aus Versehen geschaltet wird.
# Hinweis: Werte mit "initial:" in den YAML-Dateien springen beim Neustart von Home Assistant auf
# den Standard zurück. Dauerhaft änderst du sie in der Datei.
# ==============================================================================
title: Zendure
views:
  - title: Einstellungen
    path: einstellungen
    icon: mdi:battery-charging-wireless
    cards:
      - type: markdown
        content: >-
          **Zendure Einstellungen.** Werte direkt ändern. Änderungen an Werten mit Standard in der
          Datei (`initial`) gelten bis zum nächsten Neustart von Home Assistant.

      # ---- Allgemein ----------------------------------------------------------------
      - type: entities
        title: Allgemein
        show_header_toggle: false
        entities:
          - entity: sensor.zendure_active_season
            name: Aktive Saison
          - entity: input_datetime.zendure_conf_winter_start
            name: Winterbeginn
          - entity: input_datetime.zendure_conf_summer_start
            name: Sommerbeginn
          - entity: input_boolean.zendure_auto_mode
            name: Auto-Modus Gerät 1
          - entity: input_boolean.zendure_coordinator_enabled
            name: Koordinator aktiv
          - entity: input_boolean.zendure_dry_run
            name: Dry-Run (nur testen)
          - entity: input_select.zendure_allocation_strategy
            name: Verteilstrategie
          - entity: input_boolean.zendure_enabled
            name: Gerät 1 aktiviert
          - entity: input_boolean.zendure_2_enabled
            name: Gerät 2 aktiviert
          - entity: input_text.zendure_device_ip
            name: IP Gerät 1
          - entity: input_text.zendure_device_2_ip
            name: IP Gerät 2

      # ---- Regelung -------------------------------------------------------------------
      - type: entities
        title: Regelung (beide Geräte)
        show_header_toggle: false
        entities:
          - entity: input_number.zendure_conf_max_output
            name: Max. Abgabe pro Gerät
          - entity: input_number.zendure_conf_hysteresis
            name: Regel-Hysterese
          - entity: input_number.zendure_conf_grid_bias_winter
            name: Netz-Puffer Winter
          - entity: input_number.zendure_conf_grid_bias_summer
            name: Netz-Puffer Sommer
          - entity: input_number.zendure_conf_failsafe_watt
            name: Failsafe-Grundlast (Shelly)
          - entity: input_number.zendure_conf_saturation_watt_winter
            name: Min. Abgabe voll (Winter)
          - entity: input_number.zendure_conf_saturation_watt_summer
            name: Min. Abgabe voll (Sommer)

      # ---- Akku-Grenzen -------------------------------------------------------------
      - type: entities
        title: Akku-Grenzen
        show_header_toggle: false
        entities:
          - entity: input_number.zendure_conf_soc_off_winter
            name: Abschaltgrenze Winter
          - entity: input_number.zendure_conf_soc_off_summer
            name: Abschaltgrenze Sommer
          - entity: input_number.zendure_conf_soc_bypass_winter
            name: Bypass nur PV (Winter)
          - entity: input_number.zendure_conf_soc_bypass
            name: Bypass nur PV (Sommer)
          - entity: input_number.zendure_conf_soc_emerg_start
            name: Notladung Start unter
          - entity: input_number.zendure_conf_soc_emerg_stop
            name: Notladung Stopp über
          - entity: input_number.zendure_conf_emergency_watt
            name: AC-Ladeleistung Notladung
          - entity: input_number.zendure_conf_calib_days
            name: Kalibrierung nach Tagen

      # ---- Prognose -------------------------------------------------------------------
      - type: entities
        title: Prognose
        show_header_toggle: false
        entities:
          - entity: input_number.zendure_conf_forecast_factor
            name: Prognose-Faktor
          - entity: input_number.zendure_conf_forecast_thresh
            name: Prognoseschwelle Notladung
          - entity: input_text.zmon_fc_suffix_1
            name: Prognose-Suffix Gerät 1
          - entity: input_text.zmon_fc_suffix_2
            name: Prognose-Suffix Gerät 2

      # ---- Gerät 2 ----------------------------------------------------------------------
      - type: entities
        title: Gerät 2 (Charge-First und Assist)
        show_header_toggle: false
        entities:
          - entity: input_number.zendure_2_conf_capacity_factor
            name: Kapazitätsfaktor (G1 = 1)
          - entity: input_number.zendure_2_conf_pv_factor
            name: PV-Faktor (G1 = 1)
          - entity: input_number.zendure_2_conf_discharge_release_soc
            name: Freigabe ab (0=aus)
          - entity: input_number.zendure_2_conf_discharge_hysteresis
            name: Sperr-Hysterese Charge-First
          - entity: input_number.zendure_2_conf_assist_deficit_w
            name: Assist ab Fehlbetrag (0=aus)
          - entity: input_number.zendure_2_conf_assist_min_soc
            name: Assist Mindest-Ladestand
          - type: simple-entity
            entity: input_boolean.zendure_2_discharge_released
            name: Abgabe freigegeben
          - type: simple-entity
            entity: binary_sensor.zendure_2_assist_request
            name: Assist aktiv (G2)
          - type: simple-entity
            entity: sensor.zendure_assist_deficit
            name: Fehlbetrag andere Geräte

      # ---- Status (nur Anzeige) -------------------------------------------------------
      - type: entities
        title: Status Gerät 1 und 2
        show_header_toggle: false
        entities:
          - type: simple-entity
            entity: input_boolean.zendure_emergency_charge
            name: Notladung G1 aktiv
          - type: simple-entity
            entity: input_boolean.zendure_calibration_mode
            name: Kalibrierung G1 läuft
          - type: simple-entity
            entity: input_datetime.zendure_last_full_charge
            name: Letzte Volladung G1
          - type: simple-entity
            entity: input_number.zendure_last_sent_limit
            name: Zuletzt gesendet G1
          - type: divider
          - type: simple-entity
            entity: input_boolean.zendure_2_emergency_charge
            name: Notladung G2 aktiv
          - type: simple-entity
            entity: input_boolean.zendure_2_calibration_mode
            name: Kalibrierung G2 läuft
          - type: simple-entity
            entity: input_datetime.zendure_2_last_full_charge
            name: Letzte Volladung G2
          - type: simple-entity
            entity: input_number.zendure_2_last_sent_limit
            name: Zuletzt gesendet G2

      # ---- Berechnete Werte -------------------------------------------------------------
      - type: markdown
        title: Wirksame Werte (berechnet)
        content: |-
          {% set season = 'summer' if states('sensor.zendure_active_season') == 'summer' else 'winter' -%}
          {% set ff = states('input_number.zendure_conf_forecast_factor') | float(100) / 100 -%}
          {% set capf = states('input_number.zendure_2_conf_capacity_factor') | float(0.5) -%}
          {% set pvf = states('input_number.zendure_2_conf_pv_factor') | float(0.25) -%}
          {% set thr = states('input_number.zendure_conf_forecast_thresh') | float(2.5) -%}
          {% set rel = states('input_number.zendure_2_conf_discharge_release_soc') | float(0) -%}
          | Wert | Aktuell |
          |---|---|
          | Aktive Abschaltgrenze | {{ states('input_number.zendure_conf_soc_off_' ~ season) | float(20) | round(0) | int }} % |
          | Aktive Bypass-Grenze | {{ states('input_number.zendure_conf_soc_bypass' ~ ('_winter' if season == 'winter' else '')) | float(20) | round(0) | int }} % |
          | Aktiver Netz-Puffer | {{ states('input_number.zendure_conf_grid_bias_' ~ season) | float(0) | round(0) | int }} W |
          | G2 Failsafe wirksam | {{ (states('input_number.zendure_conf_failsafe_watt') | float(130) * capf) | round(0) | int }} W |
          | G2 Notladeleistung wirksam | {{ (states('input_number.zendure_conf_emergency_watt') | float(500) * capf) | round(0) | int }} W |
          | G2 Min. Abgabe voll wirksam | {{ (states('input_number.zendure_conf_saturation_watt_' ~ season) | float(250) * pvf) | round(0) | int }} W |
          | G1 Prognose-Auslöser (roh) | {{ (thr / ff) | round(2) }} kWh |
          | G2 Prognose-Auslöser (roh) | {{ (thr * pvf / ff) | round(2) }} kWh |
          | G2 Wiedersperre unter | {{ 'aus (Freigabe 0)' if rel <= 0 else ((rel - states('input_number.zendure_2_conf_discharge_hysteresis') | float(5)) | round(0) | int ~ ' %') }} |

      # ---- Optional: Lampe (nur mit zendure_lamp.yaml) -----------------------------
      - type: entities
        title: Lampe (optional)
        show_header_toggle: false
        entities:
          - entity: input_boolean.zendure_lamp_enforce
            name: Lampe aus nach Start
          - entity: input_number.zendure_conf_lamp_off_value
            name: Wert für Lampe AUS
